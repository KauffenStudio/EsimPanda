<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>iPad 9 — Online everywhere</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  html, body, .canvas { width: 2064px; height: 2752px; }
  .canvas { background: #0C0D10; overflow: hidden; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(180deg, rgba(8,10,16,0.76) 0%, rgba(8,10,16,0.16) 28%, rgba(8,10,16,0) 48%),
      linear-gradient(0deg, rgba(8,10,16,0.88) 0%, rgba(8,10,16,0.24) 26%, rgba(8,10,16,0) 52%); }

  .l-caption { position: absolute; top: 230px; left: 160px; right: 160px; z-index: 5; text-align: center; }
  .l-caption .eyebrow { font-size: 40px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #FFC98F; margin-bottom: 30px; }
  .l-caption h1 { font-size: 158px; line-height: 0.95; letter-spacing: -0.045em; font-weight: 800; color: #fff; text-shadow: 0 4px 40px rgba(0,0,0,0.45); }
  .l-caption p { margin-top: 34px; font-size: 58px; font-weight: 500; color: rgba(255,255,255,0.88); letter-spacing: -0.01em; }

  .phone-sm { position: absolute; z-index: 6; width: 760px; height: 1540px; right: 240px; bottom: 280px;
    background: #050507; border-radius: 86px; padding: 16px; box-shadow: 0 80px 150px rgba(0,0,0,0.65), 0 30px 60px rgba(0,0,0,0.45); transform: rotate(-3deg); }
  .phone-sm::before { content:''; position:absolute; inset:-3px; border-radius:89px; background: linear-gradient(145deg,#7c8089,#1d1f24 40%,#54585f 78%,#14151a); z-index:-1; }
  .phone-sm .scr { position: relative; width: 100%; height: 100%; background: #0E1116; border-radius: 72px; overflow: hidden; }
  .phone-sm .island { position:absolute; top:24px; left:50%; transform:translateX(-50%); width:220px; height:50px; background:#000; border-radius:999px; z-index:5; }
  .phone-sm .sb { display:flex; justify-content:space-between; padding:42px 50px 0; color:#fff; font-size:28px; font-weight:600; }
  .phone-sm .sb svg { width: 32px; height: 20px; }

  .dash { padding: 44px 44px; color: #fff; }
  .dash .hello { font-size: 30px; color: rgba(255,255,255,0.55); font-weight: 500; }
  .dash .h { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
  .dash .esim-card { margin-top: 40px; border-radius: 44px; padding: 44px 40px; background: linear-gradient(150deg, #2979FF 0%, #1858C4 100%); box-shadow: 0 24px 50px rgba(41,121,255,0.4); position: relative; overflow: hidden; }
  .dash .esim-card .glow { position:absolute; width:320px; height:320px; border-radius:50%; background:rgba(255,255,255,0.16); filter:blur(44px); top:-90px; right:-60px; }
  .dash .esim-card .top { display:flex; align-items:center; justify-content:space-between; position:relative; }
  .dash .esim-card .flag { font-size: 66px; }
  .dash .esim-card .status { display:flex; align-items:center; gap:12px; font-size:28px; font-weight:700; background:rgba(255,255,255,0.2); padding:14px 24px; border-radius:999px; }
  .dash .esim-card .status .led { width:18px; height:18px; border-radius:50%; background:#7CF7B0; box-shadow:0 0 0 6px rgba(124,247,176,0.3); }
  .dash .esim-card .dest { margin-top:30px; font-size:62px; font-weight:800; letter-spacing:-0.02em; }
  .dash .esim-card .sub { font-size:28px; color:rgba(255,255,255,0.8); font-weight:500; margin-top:6px; }
  .dash .esim-card .bar { margin-top:36px; height:22px; border-radius:9px; background:rgba(255,255,255,0.22); overflow:hidden; }
  .dash .esim-card .bar .fill { width:62%; height:100%; border-radius:9px; background:#fff; }
  .dash .esim-card .bar-l { margin-top:18px; display:flex; justify-content:space-between; font-size:26px; font-weight:600; color:rgba(255,255,255,0.9); }
  .dash .quick { margin-top: 34px; display:flex; gap:20px; }
  .dash .quick .q { flex:1; background:#161A22; border-radius:30px; padding:32px 24px; text-align:center; }
  .dash .quick .q .ic { font-size:44px; }
  .dash .quick .q .t { margin-top:14px; font-size:26px; font-weight:600; color:rgba(255,255,255,0.85); }

  .float-status { position: absolute; z-index: 7; left: 240px; bottom: 700px; background: #fff; border-radius: 32px; padding: 30px 38px; display:flex; align-items:center; gap:20px; box-shadow: 0 30px 70px rgba(0,0,0,0.45); font-size: 38px; font-weight: 700; color: var(--c-ink); transform: rotate(3deg); }
  .float-status .bars { display:flex; align-items:flex-end; gap:6px; }
  .float-status .bars i { width:11px; background:var(--c-success); border-radius:3px; }
  .float-status .bars i:nth-child(1){height:16px;} .float-status .bars i:nth-child(2){height:26px;} .float-status .bars i:nth-child(3){height:36px;} .float-status .bars i:nth-child(4){height:46px;}

  .brandbar { position:absolute; z-index:6; bottom:120px; left:0; right:0; text-align:center; display:flex; align-items:center; justify-content:center; gap:22px; color:#fff; }
  .brandbar .m { width:78px; height:78px; border-radius:24px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .brandbar .m img { width:100%; height:100%; object-fit:cover; }
  .brandbar .nm { font-size:50px; font-weight:800; letter-spacing:-0.02em; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"><img src="../lifestyle/bg-mountain-ipad.jpg" alt="" /></div>
  <div class="scrim"></div>

  <div class="l-caption">
    <div class="eyebrow">Wherever you roam</div>
    <h1>Online, even up here.</h1>
    <p>Fast 5G in 100+ destinations.</p>
  </div>

  <div class="float-status"><span class="bars"><i></i><i></i><i></i><i></i></span><span>Connected · 5G</span></div>

  <div class="phone-sm">
    <div class="scr">
      <div class="island"></div>
      <div class="sb"><span>9:41</span><span style="display:flex; gap:8px; align-items:center;">
        <svg viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 24 12" fill="#fff"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><rect x="3" y="3" width="14" height="6" rx="1.5"/><rect x="22" y="4" width="1.5" height="4" rx="0.5"/></svg>
      </span></div>
      <div class="dash">
        <div class="hello">You're connected</div>
        <div class="h">Live data</div>
        <div class="esim-card">
          <div class="glow"></div>
          <div class="top"><span class="flag">🇨🇭</span><span class="status"><span class="led"></span>Connected</span></div>
          <div class="dest">Switzerland</div>
          <div class="sub">5 GB · 26 days left</div>
          <div class="bar"><div class="fill"></div></div>
          <div class="bar-l"><span>3.1 GB left</span><span>5G</span></div>
        </div>
        <div class="quick">
          <div class="q"><div class="ic">🗺️</div><div class="t">Maps</div></div>
          <div class="q"><div class="ic">📷</div><div class="t">Upload</div></div>
          <div class="q"><div class="ic">↻</div><div class="t">Top up</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="brandbar"><span class="m"><img src="../lifestyle/panda-face.png" alt=""/></span><span class="nm">eSIM Panda</span></div>
</div>
</body>
</html>
